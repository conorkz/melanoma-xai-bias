# Stage 2: architecture comparison, CE baseline versus the best imbalance configuration.
# 6 variants x 3 seeds = 18 runs. Update the best_imbalance variants after Stage 1
# if a different loss or sampler wins.
#
# Generate configs:  python scripts/run_sweep.py --config configs/sweep_stage2.yaml --dry-run
# Run the grid:      python scripts/run_sweep.py --config configs/sweep_stage2.yaml --skip-existing
# Build the table:   python scripts/collect_results.py --run-prefix stage2 --prefix rq1_stage2
name: stage2
base: configs/pilot.yaml
seeds: [1, 2, 3]

variants:
  - name: resnet50_ce_random
    overrides:
      model.backbone: resnet50
      training.loss: ce
      training.sampler: random

  - name: resnet50_best_imbalance
    overrides:
      model.backbone: resnet50
      training.loss: focal
      training.focal_gamma: 2.0
      training.sampler: class_balanced

  - name: efficientnet_b0_ce_random
    overrides:
      model.backbone: efficientnet_b0
      training.loss: ce
      training.sampler: random

  - name: efficientnet_b0_best_imbalance
    overrides:
      model.backbone: efficientnet_b0
      training.loss: focal
      training.focal_gamma: 2.0
      training.sampler: class_balanced

  - name: vit_s_ce_random
    overrides:
      model.backbone: vit_small_patch16_224
      training.img_size: 224
      training.loss: ce
      training.sampler: random

  - name: vit_s_best_imbalance
    overrides:
      model.backbone: vit_small_patch16_224
      training.img_size: 224
      training.loss: focal
      training.focal_gamma: 2.0
      training.sampler: class_balanced
