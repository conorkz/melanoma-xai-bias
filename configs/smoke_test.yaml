run_name: smoke_test
seed: 42

data:
  root: data
  metadata_csv: data/raw/HAM10000_metadata.csv
  images_dir: data/HAM10000/images
  split:
    val_fraction: 0.15
    test_fraction: 0.15
  subset_size: 2000
  task: binary

model:
  backbone: resnet18
  pretrained: true
  num_classes: 2

training:
  epochs: 3
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  img_size: 160
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  sampler: class_balanced
  num_workers: 2
  early_stopping_patience: 2
